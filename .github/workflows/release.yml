name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A tagged release must carry the newest shared web UI: the embedded
      # copy has to match mibee-eye-webui@main byte-for-byte, otherwise the
      # release fails and the frontend is re-synced first (make sync-go in
      # the mibee-eye-webui repo).
      - name: Verify the embedded web UI matches mibee-eye-webui@main
        run: |
          git clone --depth 1 https://github.com/xiqing85/mibee-eye-webui.git /tmp/mibee-eye-webui
          diff -r /tmp/mibee-eye-webui/static internal/web/static
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
