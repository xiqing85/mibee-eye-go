name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo hygiene gate (junk/secret files must not be tracked)
        run: tools/check-repo-hygiene.sh

  hardcode:
    # 硬编码门禁（2026-09-15 规范）：应配置化的值不得硬编码——设备路径、
    # IP、版本串、国标 ID、外部可执行名；默认值只在配置模块声明。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hardcoded-value gate (values must be configurable)
        run: tools/check-hardcode.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go test -v ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: GOOS=linux GOARCH=arm64 go build -v ./...

  identity:
    # 身份门禁（2026-09-27）：公开历史只允许已验证的 xiqing85 noreply 身份
    # （324791119）。捏造的 noreply 数字 ID 曾把陌生账号挂上贡献者列表。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identity allowlist (verified xiqing85 noreply only)
        run: |
          ok="324791119+xiqing85@users.noreply.github.com"
          viol=$(git log --format="%ae%n%(trailers:key=Co-authored-by,valueonly)" \
            | grep -oE "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+" | sort -u \
            | grep -vxF -e "$ok"  || true)
          violc=$(git log --format="%ce" \
            | grep -oE "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+" | sort -u \
            | grep -vxF -e "$ok" -e "noreply@github.com" || true)
          if [ -n "$viol$violc" ]; then
            echo "::error::Non-allowlisted identity emails — author/trailer [$viol] committer [$violc]"
            exit 1
          fi
